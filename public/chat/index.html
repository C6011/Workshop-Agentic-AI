<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Desk — Chat</title>
  <style>
    :root{--ink:#304653;--muted:#71858b;--line:#dcebef;--lavender:#fff4c7;--blue:#dff5f4;--accent:#f4c95d;--accent-dark:#e5ad32}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:linear-gradient(135deg,#e5f7ff,#f2fff4 48%,#fff9db)}
    body:before,body:after{position:fixed;z-index:-1;width:280px;height:280px;border-radius:50%;content:"";filter:blur(8px);opacity:.6}body:before{top:-100px;left:-70px;background:#bfeaff}body:after{right:-90px;bottom:-100px;background:#d5f4c8}
    main{width:min(100% - 32px,880px);margin:auto;padding:28px 0 34px}.back-link{color:var(--muted);font-size:.9rem;text-decoration:none}.back-link:hover{color:#3c9aa0}
    .shell{overflow:hidden;margin-top:16px;border:1px solid rgba(255,255,255,.9);border-radius:28px;background:rgba(255,255,255,.78);box-shadow:0 24px 70px rgba(77,157,157,.14);backdrop-filter:blur(18px)}
    .hero{padding:30px 32px 24px;border-bottom:1px solid var(--line)}.brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:13px}.brand-mark{display:grid;width:48px;height:48px;place-items:center;border-radius:16px;background:linear-gradient(135deg,#bfeaff,#d9f4c5);font-size:1.5rem}h1{margin:0;font-size:clamp(1.55rem,4vw,2rem);letter-spacing:-.04em}.subtitle{margin:5px 0 0;color:var(--muted);font-size:.94rem}.status{display:flex;align-items:center;gap:7px;color:#579b76;font-size:.8rem}.status:before{width:8px;height:8px;border-radius:50%;background:#91dca9;content:""}
    .settings{display:grid;grid-template-columns:170px 1fr;gap:12px;margin-top:24px}label{display:block;margin:0 0 7px 3px;color:var(--muted);font-size:.78rem;font-weight:650}select,input,button{font:inherit}select,.settings input{width:100%;padding:11px 13px;color:var(--ink);border:1px solid var(--line);border-radius:12px;outline:0;background:rgba(255,255,255,.84);transition:border-color .2s,box-shadow .2s}select:focus,input:focus{border-color:#8bd3d1;box-shadow:0 0 0 4px #dff5f4}
    .messages{min-height:390px;max-height:54vh;overflow-y:auto;padding:24px 32px}.empty-state{display:grid;min-height:300px;place-items:center;text-align:center;color:var(--muted)}.empty-state div{max-width:330px}.empty-icon{display:grid;width:78px;height:78px;margin:0 auto 12px;place-items:center;border-radius:26px;background:linear-gradient(145deg,#e5f7ff,#fff4c7);box-shadow:0 10px 24px rgba(83,174,165,.16)}.empty-icon svg{width:64px;height:64px}.empty-state p{margin:5px 0;font-size:.92rem}.bubble{max-width:min(78%,600px);margin:12px 0;padding:13px 17px;border-radius:18px;line-height:1.6;white-space:pre-wrap;animation:rise .22s ease-out}.user{margin-left:auto;color:#6e5a21;border-bottom-right-radius:5px;background:var(--lavender)}.assistant{border-bottom-left-radius:5px;background:var(--blue);box-shadow:0 5px 16px rgba(74,157,157,.1)}
    .composer{padding:18px 32px 26px;border-top:1px solid var(--line);background:rgba(255,255,255,.52)}.form{display:flex;gap:10px}.form input{flex:1;min-width:0;padding:13px 16px;border:1px solid var(--line);border-radius:14px;outline:0;background:#fff}button{padding:0 20px;color:#5d4a12;border:0;border-radius:14px;background:var(--accent);cursor:pointer;transition:transform .2s,background .2s}button:hover{background:var(--accent-dark);transform:translateY(-1px)}button:disabled{cursor:wait;opacity:.65;transform:none}.hint{margin:10px 2px 0;color:var(--muted);font-size:.75rem}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:600px){main{width:min(100% - 20px,880px);padding-top:16px}.hero,.messages,.composer{padding-right:18px;padding-left:18px}.settings{grid-template-columns:1fr;gap:10px}.status{display:none}.bubble{max-width:88%}.form button{padding:0 15px}}
</style>
</head>
<body><main><a class="back-link" href="/">← กลับไป Portal</a><section class="shell"><header class="hero"><div class="brand-row"><div class="brand"><div class="brand-mark">💬</div><div><h1>หน้าต่าง Chat</h1><p class="subtitle">ผู้ช่วย AI สำหรับทุกไอเดียของคุณ</p></div></div><div class="status">พร้อมใช้งาน</div></div><div class="settings"><div><label for="provider">เลือก provider</label><select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select></div><div><label for="model">Model <span>(ไม่บังคับ)</span></label><input id="model" placeholder="ใช้ model ค่าเริ่มต้นถ้าว่าง"></div></div></header><div id="messages" class="messages"><div class="empty-state"><div><div class="empty-icon" aria-label="มาสคอตผู้ช่วย AI" role="img"><svg viewBox="0 0 80 80" aria-hidden="true"><path d="M20 29 15 14l16 9c5-2 13-2 18 0l16-9-5 15c4 5 6 10 6 19 0 15-10 24-26 24S14 63 14 48c0-9 2-14 6-19Z" fill="#9eddd5"/><path d="M22 35c0-9 8-16 18-16s18 7 18 16v17c0 10-7 17-18 17s-18-7-18-17V35Z" fill="#fff"/><circle cx="34" cy="45" r="3" fill="#304653"/><circle cx="46" cy="45" r="3" fill="#304653"/><path d="M35 55c3 3 7 3 10 0" fill="none" stroke="#59aeb0" stroke-linecap="round" stroke-width="3"/><circle cx="25" cy="51" r="4" fill="#b9e9d2" opacity=".9"/><circle cx="55" cy="51" r="4" fill="#b9e9d2" opacity=".9"/><path d="M40 19v-6" stroke="#59aeb0" stroke-linecap="round" stroke-width="3"/><circle cx="40" cy="10" r="4" fill="#f4c95d"/></svg></div><strong>เริ่มบทสนทนาใหม่</strong><p>ลองพิมพ์คำถามหรือไอเดียที่อยากให้ผู้ช่วยช่วยดูได้เลย</p></div></div></div><div class="composer"><form id="form" class="form"><input id="message" autocomplete="off" placeholder="พิมพ์ข้อความของคุณที่นี่..." required><button type="submit">ส่ง&nbsp; ↗</button></form><div class="hint">ประวัติการสนทนาจะอยู่ในหน้านี้เท่านั้น และจะไม่ถูกบันทึกข้ามการรีโหลด</div></div></section></main><script src="/chat/app.js"></script></body>
</html>
