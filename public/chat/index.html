<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Desk — Chat</title>
  <style>
    :root{--ink:#354052;--muted:#7d8798;--line:#e8e9f2;--lavender:#eeeaff;--blue:#dff1ff;--accent:#8878df;--accent-dark:#6557be}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:linear-gradient(135deg,#f5f3ff,#f8fbff 48%,#fff4f7)}
    body:before,body:after{position:fixed;z-index:-1;width:280px;height:280px;border-radius:50%;content:"";filter:blur(8px);opacity:.55}body:before{top:-100px;left:-70px;background:#e6deff}body:after{right:-90px;bottom:-100px;background:#ffdfe9}
    main{width:min(100% - 32px,880px);margin:auto;padding:28px 0 34px}.back-link{color:var(--muted);font-size:.9rem;text-decoration:none}.back-link:hover{color:var(--accent-dark)}
    .shell{overflow:hidden;margin-top:16px;border:1px solid rgba(255,255,255,.82);border-radius:28px;background:rgba(255,255,255,.76);box-shadow:0 24px 70px rgba(101,87,190,.12);backdrop-filter:blur(18px)}
    .hero{padding:30px 32px 24px;border-bottom:1px solid var(--line)}.brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:13px}.brand-mark{display:grid;width:48px;height:48px;place-items:center;border-radius:16px;background:linear-gradient(135deg,#ded7ff,#d9efff);font-size:1.5rem}h1{margin:0;font-size:clamp(1.55rem,4vw,2rem);letter-spacing:-.04em}.subtitle{margin:5px 0 0;color:var(--muted);font-size:.94rem}.status{display:flex;align-items:center;gap:7px;color:#5b9e83;font-size:.8rem}.status:before{width:8px;height:8px;border-radius:50%;background:#86d8b7;content:""}
    .settings{display:grid;grid-template-columns:170px 1fr;gap:12px;margin-top:24px}label{display:block;margin:0 0 7px 3px;color:var(--muted);font-size:.78rem;font-weight:650}select,input,button{font:inherit}select,.settings input{width:100%;padding:11px 13px;color:var(--ink);border:1px solid var(--line);border-radius:12px;outline:0;background:rgba(255,255,255,.8);transition:border-color .2s,box-shadow .2s}select:focus,input:focus{border-color:#afa5ed;box-shadow:0 0 0 4px #e8e3ff}
    .messages{min-height:390px;max-height:54vh;overflow-y:auto;padding:24px 32px}.empty-state{display:grid;min-height:300px;place-items:center;text-align:center;color:var(--muted)}.empty-state div{max-width:330px}.empty-icon{margin-bottom:10px;font-size:2.5rem}.empty-state p{margin:5px 0;font-size:.92rem}.bubble{max-width:min(78%,600px);margin:12px 0;padding:13px 17px;border-radius:18px;line-height:1.6;white-space:pre-wrap;animation:rise .22s ease-out}.user{margin-left:auto;color:#4f477e;border-bottom-right-radius:5px;background:var(--lavender)}.assistant{border-bottom-left-radius:5px;background:var(--blue);box-shadow:0 5px 16px rgba(105,145,180,.08)}
    .composer{padding:18px 32px 26px;border-top:1px solid var(--line);background:rgba(255,255,255,.46)}.form{display:flex;gap:10px}.form input{flex:1;min-width:0;padding:13px 16px;border:1px solid var(--line);border-radius:14px;outline:0;background:#fff}button{padding:0 20px;color:#fff;border:0;border-radius:14px;background:var(--accent);cursor:pointer;transition:transform .2s,background .2s}button:hover{background:var(--accent-dark);transform:translateY(-1px)}button:disabled{cursor:wait;opacity:.65;transform:none}.hint{margin:10px 2px 0;color:var(--muted);font-size:.75rem}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:600px){main{width:min(100% - 20px,880px);padding-top:16px}.hero,.messages,.composer{padding-right:18px;padding-left:18px}.settings{grid-template-columns:1fr;gap:10px}.status{display:none}.bubble{max-width:88%}.form button{padding:0 15px}}
  </style>
</head>
<body><main><a class="back-link" href="/">← กลับไป Portal</a><section class="shell"><header class="hero"><div class="brand-row"><div class="brand"><div class="brand-mark">💬</div><div><h1>หน้าต่าง Chat</h1><p class="subtitle">ผู้ช่วย AI สำหรับทุกไอเดียของคุณ</p></div></div><div class="status">พร้อมใช้งาน</div></div><div class="settings"><div><label for="provider">เลือก provider</label><select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select></div><div><label for="model">Model <span>(ไม่บังคับ)</span></label><input id="model" placeholder="ใช้ model ค่าเริ่มต้นถ้าว่าง"></div></div></header><div id="messages" class="messages"><div class="empty-state"><div><div class="empty-icon">🌷</div><strong>เริ่มบทสนทนาใหม่</strong><p>ลองพิมพ์คำถามหรือไอเดียที่อยากให้ผู้ช่วยช่วยดูได้เลย</p></div></div></div><div class="composer"><form id="form" class="form"><input id="message" autocomplete="off" placeholder="พิมพ์ข้อความของคุณที่นี่..." required><button type="submit">ส่ง&nbsp; ↗</button></form><div class="hint">ประวัติการสนทนาจะอยู่ในหน้านี้เท่านั้น และจะไม่ถูกบันทึกข้ามการรีโหลด</div></div></section></main><script src="/chat/app.js"></script></body>
</html>
